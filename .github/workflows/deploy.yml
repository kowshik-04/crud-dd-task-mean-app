name: Build & Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-frontend:latest

    - name: Build & push backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Prepare deploy script
      run: |
        cat > deploy.sh <<'EOF'
        #!/bin/bash
        set -euo pipefail
        echo "Pulling images..."
        docker pull ${DOCKERHUB_USERNAME}/crud-dd-frontend:latest
        docker pull ${DOCKERHUB_USERNAME}/crud-dd-backend:latest

        echo "Stopping old containers..."
        docker rm -f app-frontend-1 || true
        docker rm -f app-backend-1 || true

        echo "Starting backend..."
        docker run -d --name app-backend-1 \
          --network app_app-network \
          --restart unless-stopped \
          ${DOCKERHUB_USERNAME}/crud-dd-backend:latest

        echo "Starting frontend..."
        docker run -d --name app-frontend-1 \
          --network app_app-network \
          --restart unless-stopped \
          ${DOCKERHUB_USERNAME}/crud-dd-frontend:latest
        EOF
        chmod +x deploy.sh

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v0.1.9
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: |
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
        script: |
          cat > /tmp/gh-deploy.sh <<'EOF'
          $(sed -n '1,200p' deploy.sh)
          EOF
          chmod +x /tmp/gh-deploy.sh
          /tmp/gh-deploy.sh
