name: Build & Deploy to EC2 (docker-compose)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-frontend:latest

      - name: Build & push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files (debug)
        run: ls -la

      - name: Deploy with docker compose on remote
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: |
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          script: |
            set -euo pipefail

            # ensure target dir exists
            mkdir -p /home/${{ secrets.SSH_USER }}/app

            # write docker-compose.yml on remote
            cat > /home/${{ secrets.SSH_USER }}/app/docker-compose.yml <<'YAML'$(sed -n '1,200p' docker-compose.yml)YAML

            # if we have default.conf in the repo root, copy it to remote app dir
            if [ -f default.conf ]; then
              cat > /home/${{ secrets.SSH_USER }}/app/default.conf <<'CONF'$(sed -n '1,200p' default.conf 2>/dev/null || true)CONF
            fi

            # go to app dir and pull + recreate services using the compose plugin if available
            cd /home/${{ secrets.SSH_USER }}/app

            if docker compose version >/dev/null 2>&1; then
              docker compose pull
              docker compose up -d
            elif docker-compose version >/dev/null 2>&1; then
              docker-compose pull
              docker-compose up -d
            else
              echo "docker compose or docker-compose not found on host. Please install docker compose plugin or docker-compose CLI."
              exit 1
            fi

            # show deployed containers
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

