name: Build & Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU (for multi-arch, optional)
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build & push frontend
    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-frontend:latest

    # Build & push backend
    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-backend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare deploy script
      run: |
        cat > deploy.sh <<'EOF'
        #!/bin/bash
        set -euo pipefail
        echo "Starting remote deploy..."
        # Pull images
        docker pull ${DOCKERHUB_USERNAME}/crud-dd-frontend:latest
        docker pull ${DOCKERHUB_USERNAME}/crud-dd-backend:latest

        # stop old containers (if named like this)
        docker rm -f app-frontend-1 || true
        docker rm -f app-backend-1 || true

        # run backend
        docker run -d --name app-backend-1 \
          --network app_app-network \
          --restart unless-stopped \
          ${DOCKERHUB_USERNAME}/crud-dd-backend:latest

        # run frontend (serves static files; port binding not required if nginx proxies)
        docker rm -f app-frontend-1 || true
        docker run -d --name app-frontend-1 \
          --network app_app-network \
          --restart unless-stopped \
          ${DOCKERHUB_USERNAME}/crud-dd-frontend:latest
        EOF
        chmod +x deploy.sh

    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v0.1.9
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: |
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
        script: |
          # copy and run the script we created in the repo workspace
          cat > /tmp/gh-deploy.sh <<'EOF'
          $(sed -n '1,200p' deploy.sh)
          EOF
          chmod +x /tmp/gh-deploy.sh
          /tmp/gh-deploy.sh
