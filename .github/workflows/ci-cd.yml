name: CI/CD Build and Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-frontend:latest

  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait for images to be available
        run: sleep 5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            # Ensure docker-compose is present on remote VM
            docker --version || (curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh)
            docker compose version || (sudo apt-get update && sudo apt-get install -y docker-compose-plugin)

            # In the remote working dir where docker-compose.yml is stored (change if different)
            cd ~/app || mkdir -p ~/app && cd ~/app

            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/crud-dd-frontend:latest

            # Create or update docker-compose.yml on remote host
            cat > docker-compose.yml <<'EOF'
version: '3.8'
services:
  mongo:
    image: mongo:5.0
    restart: always
    volumes:
      - mongo_data:/data/db

  backend:
    image: $DOCKERHUB_USER/crud-dd-backend:latest
    environment:
      - MONGO_URI=mongodb://mongo:27017/dd_db
    depends_on:
      - mongo

  frontend:
    image: $DOCKERHUB_USER/crud-dd-frontend:latest
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
EOF

            # Write a default nginx config if not present
            if [ ! -f default.conf ]; then
              cat > default.conf <<'NG'
server {
    listen 80;
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
NG
            fi

            # Export Dockerhub user env used in compose
            export DOCKERHUB_USER=${{ secrets.DOCKERHUB_USERNAME }}

            # Pull/update compose and bring up
            docker compose pull || true
            docker compose up -d --remove-orphans

            # Optional: show logs
            docker compose ps
