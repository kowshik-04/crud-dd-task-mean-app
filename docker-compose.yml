version: "3.8"
services:
  backend:
    image: kowshik04/crud-dd-backend:latest
    container_name: app-backend-1
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - MONGO_URI=mongodb://mongo:27017/testdb
    depends_on:
      - mongo

  frontend:
    image: kowshik04/crud-dd-frontend:latest
    container_name: app-frontend-1
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: app-nginx-1
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

  mongo:
    image: mongo:5.0
    container_name: app-mongo-1
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:

